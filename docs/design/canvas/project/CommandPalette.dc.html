<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurelia — Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="dialog" aria-label="Command palette" style="width: 640px; height: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: 14px; box-shadow: {{t.shadow}}; overflow: hidden; color: {{t.ink}}; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; line-height: 1.4">
<label style="height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid {{t.line}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.ink3}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search or run a command</span>
<input type="text" value="tomas" role="combobox" aria-expanded="true" aria-controls="cp-results" aria-activedescendant="cp-opt-0" aria-autocomplete="list" style="flex: 1; border: 0; outline: 0; background: transparent; color: {{t.ink}}; font: 400 16px Inter, sans-serif">
<span style="padding: 2px 8px; border-radius: 6px; background: {{t.raised}}; color: {{t.ink2}}; font: 500 11.5px Inter, sans-serif">Saltmarch</span>
</label>
<div id="cp-results" role="listbox" aria-label="Results" style="flex: 1; overflow: hidden; padding: 6px 8px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div role="group" aria-label="{{g.label}}">
<div aria-hidden="true" style="padding: 8px 8px 4px; font: 600 10.5px Inter, sans-serif; letter-spacing: .09em; text-transform: uppercase; color: {{t.ink3}}">{{g.label}}</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<div id="{{it.id}}" role="option" aria-selected="{{it.selected}}" style="height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 10px; border-radius: 8px; background: {{it.bg}}">
<span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: {{it.iconBg}}; color: {{it.iconColor}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 500; color: {{t.ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span><span style="font-size: 12px; color: {{t.ink3}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.sub}}</span></span>
<span style="font-size: 11.5px; color: {{t.ink3}}">{{it.hint}}</span>
</div>
</sc-for>
</div>
</sc-for>
</div>
<div style="height: 38px; padding: 0 16px; display: flex; align-items: center; gap: 16px; border-top: 1px solid {{t.line}}; background: {{t.chrome}}; font-size: 11.5px; color: {{t.ink3}}">
<span><kbd style="font: 500 11px Inter, sans-serif; padding: 1px 5px; border: 1px solid {{t.line2}}; border-radius: 4px">↑</kbd> <kbd style="font: 500 11px Inter, sans-serif; padding: 1px 5px; border: 1px solid {{t.line2}}; border-radius: 4px">↓</kbd> move</span>
<span><kbd style="font: 500 11px Inter, sans-serif; padding: 1px 5px; border: 1px solid {{t.line2}}; border-radius: 4px">↵</kbd> open</span>
<span><kbd style="font: 500 11px Inter, sans-serif; padding: 1px 5px; border: 1px solid {{t.line2}}; border-radius: 4px">⌘↵</kbd> open beside</span>
<span style="flex: 1"></span>
<span><kbd style="font: 500 11px Inter, sans-serif; padding: 1px 5px; border: 1px solid {{t.line2}}; border-radius: 4px">esc</kbd> close</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":640,"height":480}}'>
const AURELIA_TOKENS = {
  light: { chrome: '#F3EEE4', canvas: '#FAF7F2', surface: '#FFFDF9', raised: '#EAE3D6', line: '#E2DACB', line2: '#CFC4B0', ink: '#1B1A1F', ink2: '#4F4D56', ink3: '#67646D', gold: '#C9A227', goldSoft: '#F5E7B5', goldInk: '#7A5A0B', tide: '#2F6690', onAccent: '#FFFDF9', shadow: '0 4px 8px rgba(40,32,16,.08), 0 24px 64px rgba(40,32,16,.22)' },
  dark: { chrome: '#0B0B0F', canvas: '#121218', surface: '#1A1A21', raised: '#26262F', line: '#2A2A33', line2: '#3A3A45', ink: '#EDEDED', ink2: '#C2BFC8', ink3: '#9A97A2', gold: '#F5C542', goldSoft: '#2E2715', goldInk: '#F5C542', tide: '#72AAD8', onAccent: '#0B0B0F', shadow: '0 4px 8px rgba(0,0,0,.4), 0 24px 64px rgba(0,0,0,.6)' }
};
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const t = AURELIA_TOKENS[theme];
    const I = {
      user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
      item: 'M6 3h12l4 6-10 12L2 9zM2 9h20',
      scene: 'M4 6h16M4 12h16M4 18h10',
      pulse: 'M3 12h4l3-8 4 16 3-8h4',
      chart: 'M3 3v18h18M7 15l4-4 3 3 5-6'
    };
    let n = 0;
    const item = function (icon, title, sub, hint, sel, accent) {
      return {
        id: 'cp-opt-' + (n++), icon: I[icon], title: title, sub: sub, hint: hint, selected: sel ? 'true' : 'false',
        bg: sel ? t.goldSoft : 'transparent',
        iconBg: accent ? t.tide : t.raised, iconColor: accent ? t.onAccent : t.ink2
      };
    };
    const groups = [
      { label: 'Records', items: [
        item('user', 'Tomas Brandt', 'Character · shared · Warden of the Lantern Gate', '14 scenes', true, true),
        item('item', 'Tomas’s ledger', 'Item · The Lantern Gate only', '3 scenes')
      ] },
      { label: 'Scenes', items: [
        item('scene', '6.1 Ropewalk', '…Tomas hears that a drowned woman walks the quarter…', 'POV Tomas'),
        item('scene', '12.2 The Ledger Burns', '…Tomas sets the lantern down…', 'Draft')
      ] },
      { label: 'Actions', items: [
        item('chart', 'Show Tomas Brandt’s progression', 'State and changes, scene by scene', ''),
        item('pulse', 'Continuity findings for Tomas Brandt', '1 check · two places at once', '')
      ] }
    ];
    return { t: t, groups: groups };
  }
}
</script>
</body>
</html>
