<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurelia — Status bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<footer style="width: 100%; min-height: 32px; box-sizing: border-box; padding: 4px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; background: {{t.chrome}}; border-top: 1px solid {{t.line}}; color: {{t.ink3}}; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-variant-numeric: tabular-nums">
<span><span style="color: {{t.ink2}}; font-weight: 500">{{scene}}</span> scene</span>
<span><span style="color: {{t.ink2}}; font-weight: 500">{{chapter}}</span> chapter</span>
<span><span style="color: {{t.ink2}}; font-weight: 500">{{book}}</span> book</span>
<span style="display: flex; align-items: center; gap: 6px">Today <span style="color: {{t.ok}}; font-weight: 600">{{today}}</span></span>
<span style="flex: 1 1 0"></span>
<span>{{where}}</span>
<span style="display: flex; align-items: center; gap: 6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{t.ok}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Saved</span>
<button type="button" title="Turn spelling and grammar checks on or off" style="height: 22px; padding: 0 6px; border: 0; border-radius: 5px; background: transparent; color: {{t.ink3}}; font: 400 12px Inter, sans-serif; cursor: pointer">Spelling: off</button>
<button type="button" title="Backup and versions" style="height: 22px; padding: 0 6px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 5px; background: {{storageBg}}; color: {{storageColor}}; font: {{storageFont}}; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"></path></svg>{{storageText}}</button>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"backup":{"editor":"enum","options":["on","none"],"default":"on"},"$preview":{"width":1440,"height":32}}'>
const AURELIA_TOKENS = {
  light: { chrome: '#F3EEE4', line: '#E2DACB', ink2: '#4F4D56', ink3: '#67646D', ok: '#2F6B3E', warn: '#9A5B07', warnSoft: '#FBF0DC' },
  dark: { chrome: '#0B0B0F', line: '#2A2A33', ink2: '#C2BFC8', ink3: '#9A97A2', ok: '#7BC08A', warn: '#E0A43A', warnSoft: '#251D0F' }
};
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const t = AURELIA_TOKENS[theme];
    const unsafe = this.props.backup === 'none';
    return {
      t: t,
      storageText: unsafe ? 'Only in this browser — turn on backup' : 'Backed up 2 min ago',
      storageColor: unsafe ? t.warn : t.ink3,
      storageBg: unsafe ? t.warnSoft : 'transparent',
      storageFont: (unsafe ? '600' : '400') + ' 12px Inter, sans-serif',
      scene: this.props.scene ?? '1,240',
      chapter: this.props.chapter ?? '4,812',
      book: this.props.book ?? '61,904',
      today: this.props.today ?? '+1,106',
      where: this.props.where ?? 'Ch. 7 · Scene 2 of 3'
    };
  }
}
</script>
</body>
</html>
