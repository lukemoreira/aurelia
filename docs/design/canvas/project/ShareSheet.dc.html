<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurelia — What will be sent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="dialog" aria-labelledby="ss-title" style="width: 600px; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: 16px; box-shadow: {{t.shadow}}; overflow: hidden; color: {{t.ink}}; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; line-height: 1.45">

<div style="padding: 20px 22px 14px; border-bottom: 1px solid {{t.line}}">
<h1 id="ss-title" style="margin: 0; font: 500 22px/1.25 Literata, Georgia, serif">Before you send</h1>
<p style="margin: 6px 0 0; color: {{t.ink2}}">This is everything the assistant will see for this question. It goes to <b style="font-weight: 600; color: {{t.ink}}">OpenAI</b>, using your ChatGPT plan. OpenAI’s terms apply to it.</p>
</div>

<div style="flex: 1; overflow: auto; padding: 8px 14px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="padding: 10px 8px 4px; display: flex; justify-content: space-between; font: 600 10.5px Inter, sans-serif; letter-spacing: .09em; text-transform: uppercase; color: {{t.ink3}}"><span>{{g.label}}</span><span>{{g.size}}</span></div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<label style="min-height: 40px; box-sizing: border-box; padding: 6px 8px; display: flex; align-items: center; gap: 10px; border-radius: 8px; cursor: pointer">
<input type="checkbox" checked="{{it.on}}" style="width: 16px; height: 16px; margin: 0; accent-color: {{t.goldInk}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 500; color: {{it.color}}">{{it.title}}</span><span style="font-size: 12px; color: {{t.ink3}}">{{it.sub}}</span></span>
<span style="font-size: 12px; color: {{t.ink3}}; font-variant-numeric: tabular-nums">{{it.size}}</span>
</label>
</sc-for>
</sc-for>
</div>

<div style="padding: 12px 22px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid {{t.line}}; background: {{t.chrome}}">
<div style="display: flex; justify-content: space-between; font-size: 12.5px"><span style="color: {{t.ink2}}">About 8,500 words · 2 items left out</span><a href="#" style="color: {{t.goldInk}}; font-weight: 500">Preview the text</a></div>
<label style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: {{t.ink2}}"><input type="checkbox" style="width: 16px; height: 16px; margin: 0; accent-color: {{t.goldInk}}">Don’t ask again for chapters 6–7 in this book</label>
<div style="display: flex; justify-content: flex-end; gap: 8px">
<button type="button" style="height: 36px; padding: 0 14px; border: 1px solid {{t.line2}}; border-radius: 8px; background: {{t.surface}}; color: {{t.ink}}; font: 500 13px Inter, sans-serif; cursor: pointer">Cancel</button>
<button type="button" style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: {{t.gold}}; color: {{t.onGold}}; font: 600 13px Inter, sans-serif; cursor: pointer">Send to OpenAI</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":600,"height":720}}'>
const AURELIA_TOKENS = {
  light: { chrome: '#F3EEE4', canvas: '#FAF7F2', surface: '#FFFDF9', raised: '#EAE3D6', line: '#E2DACB', line2: '#CFC4B0', ink: '#1B1A1F', ink2: '#4F4D56', ink3: '#67646D', gold: '#C9A227', goldSoft: '#F5E7B5', goldInk: '#7A5A0B', onGold: '#1B1A1F', shadow: '0 4px 8px rgba(40,32,16,.08), 0 24px 64px rgba(40,32,16,.22)' },
  dark: { chrome: '#0B0B0F', canvas: '#121218', surface: '#1A1A21', raised: '#26262F', line: '#2A2A33', line2: '#3A3A45', ink: '#EDEDED', ink2: '#C2BFC8', ink3: '#9A97A2', gold: '#F5C542', goldSoft: '#2E2715', goldInk: '#F5C542', onGold: '#0B0B0F', shadow: '0 4px 8px rgba(0,0,0,.4), 0 24px 64px rgba(0,0,0,.6)' }
};
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const t = AURELIA_TOKENS[theme];
    const it = function (title, sub, size, on) {
      return { title: title, sub: sub, size: size, on: on !== false, color: on === false ? t.ink3 : t.ink };
    };
    const groups = [
      { label: 'Your question', size: '', items: [
        it('“Tomas is in two places at dusk on 14 Thaw. Can you fix it without changing chapter 7?”', 'Typed by you', '22 words')
      ] },
      { label: 'Scenes · chapters 6–7', size: '6 scenes', items: [
        it('6.1 Ropewalk', 'Text and scene details', '1,640'),
        it('6.2 Tar and Twine', 'Text and scene details', '1,210'),
        it('6.3 The Customs House', 'Text and scene details', '950'),
        it('7.1 Tide Bell', 'Text and scene details', '1,900'),
        it('7.2 Curfew Bells', 'Text and scene details', '1,240'),
        it('7.3 The Warden’s Price', 'Notes only — no text yet', '40')
      ] },
      { label: 'Records', size: '3', items: [
        it('Tomas Brandt', 'Character sheet and changes', '620'),
        it('Elena Vasquez', 'Character sheet and changes', '880'),
        it('Private notes on Elena', 'Marked private — left out', '310', false)
      ] },
      { label: 'Continuity', size: '1', items: [
        it('Two places at once', 'The finding about Tomas', '40'),
        it('Research: Customs law of 412 TR', 'Not needed for this question — left out', '2,400', false)
      ] }
    ];
    return { t: t, groups: groups };
  }
}
</script>
</body>
</html>
