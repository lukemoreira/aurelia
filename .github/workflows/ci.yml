name: CI

# A branch with an open pull request is tested once, by the pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # Playwright's webServer builds the app, then serves the build.
      - run: npm run e2e

  # The storage server (server/store) has its own dependencies. It runs on Node 24 in its image.
  store:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/store/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
