# Included in every `server` and `location` that sets its own add_header: nginx drops
# the headers of the outer level when an inner level has one. `always` = also on 404/405.
# The main Content-Security-Policy is a <meta> tag made in vite.config.ts; a meta tag
# cannot set frame-ancestors, so only that is added here (browsers apply both).
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), accelerometer=(), gyroscope=(), magnetometer=(), browsing-topics=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
