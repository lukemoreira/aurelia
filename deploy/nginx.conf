# Static file server for Aurelia. Runs as user 101; the base image already keeps the
# pid file and every temp dir in /tmp, so a read-only root with a tmpfs on /tmp works.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    include /etc/nginx/security-headers.conf;

    # Only reading is allowed.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Container health check. No log line.
    location = /healthz {
        access_log off;
        include /etc/nginx/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # nginx has no MIME type for .webmanifest.
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # Hashed file names: safe to keep for a year. Cache-Control has no `always`, so it is
    # not sent on errors; a missing file goes to @asset_missing, which sends no-store so
    # Cloudflare does not keep the 404 at the edge.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        error_page 404 = @asset_missing;
        try_files $uri =404;
    }

    location @asset_missing {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # Everything else (index.html, sw.js, registerSW.js, manifest.webmanifest,
    # workbox-*.js, icons): always re-check, so updates arrive and Cloudflare keeps
    # no stale copy. Unknown paths get index.html (the app's own router handles them).
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
