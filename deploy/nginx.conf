# Static file server for Aurelia. Runs as user 101; the base image already keeps the
# pid file and every temp dir in /tmp, so a read-only root with a tmpfs on /tmp works.
#
# /dav/ is the one place that is not read-only: it goes to the storage server
# (aurelia-store, ADR-0011) when one runs next to the app.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Slow-header clients (slowloris) on the open LAN port. Only valid at server level.
    client_header_timeout 10s;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    include /etc/nginx/security-headers.conf;

    # Container health check. No log line.
    location = /healthz {
        access_log off;
        include /etc/nginx/security-headers.conf;
        default_type text/plain;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 200 "ok\n";
    }

    # The storage server. The login (Cloudflare Access) is checked by the store itself, so the
    # header goes through untouched. The name is resolved when a request comes in, not when nginx
    # starts: an install without a store still boots, and /dav/ answers 502.
    location /dav/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        if ($request_method !~ ^(GET|HEAD|OPTIONS|PUT|DELETE|PROPFIND|MKCOL|MOVE)$) { return 405; }

        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 2s;
        set $store_upstream http://aurelia-store:8081;
        proxy_pass $store_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_hide_header Cache-Control;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 64m;
        client_body_timeout 30s;
        send_timeout 30s;
    }

    # nginx has no MIME type for .webmanifest.
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    }

    # Hashed file names: safe to keep for a year. Cache-Control has no `always`, so it is
    # not sent on errors; a missing file goes to @asset_missing, which sends no-store so
    # Cloudflare does not keep the 404 at the edge.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        error_page 404 = @asset_missing;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri =404;
    }

    location @asset_missing {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # Everything else (index.html, sw.js, registerSW.js, manifest.webmanifest,
    # workbox-*.js, icons): always re-check, so updates arrive and Cloudflare keeps
    # no stale copy. Unknown paths get index.html (the app's own router handles them).
    # Only reading is allowed.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri /index.html;
    }
}
